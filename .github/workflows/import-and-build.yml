name: Import Claude source and build

on:
  push:
    branches:
      - claude-source-import

permissions:
  contents: write

jobs:
  import-and-build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          ref: claude-source-import
          fetch-depth: 0

      - name: Extract nested source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build.gradle.kts ] || [ -f build.gradle ]; then
            echo "Source tree already imported; preserving fixes."
          else
            mkdir -p /tmp/qys-wrapper /tmp/qys-source
          unzip -q files.zip -d /tmp/qys-wrapper
          SOURCE_ZIP="$(find /tmp/qys-wrapper -type f -name 'QYS-UTILS-fixed-source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d /tmp/qys-source
          BUILD_FILE="$(find /tmp/qys-source -type f -name 'build.gradle.kts' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE="$(find /tmp/qys-source -type f -name 'build.gradle' -print -quit)"
          fi
          test -n "$BUILD_FILE"
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cp -a "$PROJECT_DIR"/. .
          echo "Imported project from $PROJECT_DIR"
          test -f build.gradle.kts -o -f build.gradle
          test -f gradle.properties
          # Preserve this workflow; the imported workflow needs separate write permission.
          rm -f .github/workflows/build.yml
          fi

      - name: Commit extracted project to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Claude QYS-UTILS 26.3 source [skip ci]"
            git push origin claude-source-import
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QYS-UTILS-Claude-26.3-build
          path: |
            build/libs/*.jar
            build/reports/
          if-no-files-found: warn
