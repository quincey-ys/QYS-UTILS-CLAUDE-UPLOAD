name: Inspect and build Claude source

on:
  push:
    paths:
      - ".github/workflows/extract-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack nested source archive
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/QYS-UTILS-source-with-macros.zip"
          mkdir -p extracted
          for depth in $(seq 1 10); do
            layer="$RUNNER_TEMP/unpack-$depth"
            mkdir -p "$layer"
            unzip -q "$archive" -d "$layer"
            nested="$(find "$layer" -type f -iname '*.zip' -print -quit)"
            if [ -n "$nested" ]; then
              find "$layer" -type f ! -iname '*.zip' -exec cp --parents {} extracted/ \;
              archive="$nested"
            else
              cp -a "$layer/." extracted/
              break
            fi
          done
          echo "=== SOURCE INVENTORY ==="
          find extracted -maxdepth 10 -type f -print | sort
          test -f extracted/build.gradle.kts
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build Claude source
        working-directory: extracted
        run: gradle build --no-daemon
      - name: Upload JAR and sources
        uses: actions/upload-artifact@v4
        with:
          name: QYS-UTILS-Claude-source-build
          path: |
            extracted/build/libs/*.jar
            extracted/CHANGES.md
          if-no-files-found: error
          retention-days: 14
