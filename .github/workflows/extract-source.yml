name: Inspect and build Claude source

on:
  push:
    paths:
      - ".github/workflows/extract-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack nested source archive
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/QYS-UTILS-source-with-macros.zip"
          mkdir -p extracted
          for depth in $(seq 1 10); do
            layer="$RUNNER_TEMP/unpack-$depth"
            mkdir -p "$layer"
            unzip -q "$archive" -d "$layer"
            nested="$(find "$layer" -type f -iname '*.zip' -print -quit)"
            if [ -n "$nested" ]; then
              find "$layer" -type f ! -iname '*.zip' -exec cp --parents {} extracted/ \;
              archive="$nested"
            else
              cp -a "$layer/." extracted/
              break
            fi
          done
          test -f extracted/build.gradle.kts
      - name: Patch known 26.3 API migrations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("extracted/src/main/java/com/quinceyys/utils")
          for p in root.glob("*.java"):
              s = p.read_text()
              s = s.replace("import net.minecraft.client.util.InputConstants;", "import com.mojang.blaze3d.platform.InputConstants;")
              s = s.replace("player.swing(InteractionHand.MAIN_HAND);", "")
              p.write_text(s)
          p = root / "QysUtilsConfigScreen.java"
          p.write_text(p.read_text().replace("    protected void extractBackground(", "    public void extractBackground("))
          p = root / "AutoTotemModule.java"
          s = p.read_text()
          s = s.replace("import net.minecraft.world.inventory.ClickType;", "import net.minecraft.world.inventory.ContainerInput;")
          s = s.replace("float projected = player.fallDistance - (float) player.getDeltaMovement().y;", "double projected = player.fallDistance - player.getDeltaMovement().y;")
          s = s.replace("client.gameMode.handleInventoryMouseClick(\n                player.inventoryMenu.containerId, slotId, 40, ClickType.SWAP, player\n        );", "client.gameMode.handleContainerInput(\n                player.inventoryMenu.containerId, slotId, 40, ContainerInput.SWAP, player\n        );")
          p.write_text(s)
          PY
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build Claude source
        working-directory: extracted
        run: gradle build --no-daemon
      - name: Fix Fabric mod metadata in distributable JAR
        run: |
          python3 - <<'PY'
          import json, zipfile, tempfile, os
          from pathlib import Path
          jar = Path("extracted/build/libs/QYS-UTILS.jar")
          tmp = jar.with_suffix(".fixed.jar")
          with zipfile.ZipFile(jar, "r") as zin, zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if item.filename == "fabric.mod.json":
                      meta = json.loads(data)
                      meta["version"] = "1.0.0+26.3"
                      meta["depends"]["minecraft"] = "~26.3"
                      data = (json.dumps(meta, indent=2) + "\n").encode()
                  zout.writestr(item, data)
          os.replace(tmp, jar)
          with zipfile.ZipFile(jar) as z:
              meta = json.loads(z.read("fabric.mod.json"))
              assert meta["version"] == "1.0.0+26.3"
              assert meta["depends"]["minecraft"] == "~26.3"
              assert meta["depends"]["fabricloader"] == ">=0.20.1"
          PY
      - name: Upload JAR and sources
        uses: actions/upload-artifact@v4
        with:
          name: QYS-UTILS-Claude-source-build
          path: |
            extracted/build/libs/*.jar
            extracted/CHANGES.md
          if-no-files-found: error
          retention-days: 14
