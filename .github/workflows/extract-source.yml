name: Extract Claude source archive

on:
  push:
    paths:
      - ".github/workflows/extract-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recursively unpack uploaded ZIP
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/QYS-UTILS-source-with-macros.zip"
          mkdir -p extracted
          for depth in 1 2 3 4 5; do
            layer="$RUNNER_TEMP/layer-$depth"
            mkdir -p "$layer"
            unzip -q "$archive" -d "$layer"
            nested="$(find "$layer" -type f -name '*.zip' -print -quit)"
            nonzip="$(find "$layer" -type f ! -name '*.zip' -print -quit)"
            if [ -n "$nested" ] && [ -z "$nonzip" ]; then
              archive="$nested"
            else
              cp -a "$layer/." extracted/
              break
            fi
          done
          echo "Final source inventory:"
          find extracted -maxdepth 10 -type f -print | sort
          test -n "$(find extracted -type f -print -quit)"
          cd extracted
          zip -qr ../QYS-UTILS-extracted-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: QYS-UTILS-extracted-source
          path: QYS-UTILS-extracted-source.zip
          if-no-files-found: error
          retention-days: 7
